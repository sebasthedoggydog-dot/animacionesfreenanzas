<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolsa local vs extranjera</title>
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
  }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(../hook-dividendos/fonts/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(../hook-dividendos/fonts/montserrat-latin-900-normal.woff2) format('woff2'); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--blanco); }
  body:not(.render) { background: #8a7d78; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }
  svg { display: block; overflow: visible; }

  /* Todo vive en y 100–470: la cabeza empieza en y ≈ 500 (435 en el último plano) */
  .card { border-radius: 44px; box-shadow: 0 26px 50px rgba(20, 8, 60, .38); border: 6px solid transparent; }
  .card .ico { position: absolute; width: 112px; height: 112px; border-radius: 50%; background: var(--blanco);
    display: flex; align-items: center; justify-content: center; }
  .card .small { position: absolute; font-size: 30px; font-weight: 800; letter-spacing: .14em; color: rgba(253,253,252,.85); }
  .card .name { position: absolute; color: var(--lima); letter-spacing: -0.02em; line-height: .9; }

  /* tarjeta grande del inicio */
  #hero { left: 120px; top: 150px; width: 840px; height: 330px; background: var(--morado); }
  #hero .ico { left: 44px; top: 44px; width: 140px; height: 140px; }
  #hero .small { left: 214px; top: 62px; font-size: 36px; }
  #hero .name { left: 210px; top: 108px; font-size: 92px; }
  #spark { left: 44px; top: 214px; }
  #crecChip { left: 600px; top: 112px; background: var(--lima); color: var(--morado); font-size: 32px; padding: 12px 22px 10px;
    border-radius: 999px; border: 5px solid var(--morado); white-space: nowrap; }

  /* duelo */
  .duel { top: 110px; width: 470px; height: 350px; }
  #cE { left: 30px; background: var(--morado); }
  #cL { left: 580px; background: var(--verde); }
  .duel .ico { left: 30px; top: 30px; width: 96px; height: 96px; }
  .duel .small { left: 146px; top: 42px; font-size: 26px; }
  .duel .name { left: 144px; top: 82px; font-size: 40px; }
  .meter { position: absolute; left: 30px; right: 30px; top: 168px; height: 150px; border-radius: 28px; background: rgba(0,0,0,.18); padding: 18px 22px; }
  .meter .lbl { font-size: 28px; font-weight: 800; letter-spacing: .06em; display: flex; align-items: center; gap: 10px; height: 40px; }
  .segs { display: flex; gap: 10px; margin-top: 20px; }
  .segs i { flex: 1; height: 48px; border-radius: 14px; background: rgba(253,253,252,.18); display: block; transform-origin: bottom center; }
  .segs i.on { background: var(--lima); }
  #vs { left: 470px; top: 200px; width: 140px; height: 140px; border-radius: 50%; background: var(--lima); color: var(--morado);
    border: 8px solid var(--blanco); display: flex; align-items: center; justify-content: center; font-size: 56px; letter-spacing: -0.03em;
    box-shadow: 0 14px 30px rgba(20, 8, 60, .4); }
  .win { top: 70px; background: var(--lima); color: var(--morado); font-size: 30px; padding: 10px 20px 8px; border-radius: 999px;
    border: 5px solid var(--blanco); white-space: nowrap; box-shadow: 0 10px 20px rgba(20, 8, 60, .3); }
  .coin { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: var(--lima); color: var(--verde);
    border: 5px solid var(--blanco); display: flex; align-items: center; justify-content: center; font-size: 38px; }

  #controls { position: fixed; left: 10px; bottom: 10px; right: 10px; font: 600 14px sans-serif; color: #fff; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- globo (bolsa extranjera) -->
    <symbol id="gGlobe" viewBox="-50 -50 100 100">
      <circle r="40" fill="#5723f4"/>
      <g fill="none" stroke="#c6fd34" stroke-width="5" stroke-linecap="round">
        <circle r="40"/><ellipse class="mer" rx="17" ry="40"/><line x1="0" y1="-40" x2="0" y2="40"/>
        <path d="M-37 -15 H37 M-40 0 H40 M-37 15 H37"/>
      </g>
    </symbol>
    <!-- pin con casa (bolsa local) -->
    <symbol id="gHome" viewBox="-50 -50 100 100">
      <path d="M0 44 C-8 30 -32 12 -32 -10 A32 32 0 1 1 32 -10 C32 12 8 30 0 44Z" fill="#1a6f66"/>
      <path d="M-15 -4 L0 -18 L15 -4 V12 H-15 Z" fill="#c6fd34"/><rect x="-5" y="2" width="10" height="10" fill="#1a6f66"/>
    </symbol>
  </defs>
</svg>
<div id="stage">
  <!-- Inicio: "La bolsa extranjera … a nivel de crecimiento" -->
  <div class="abs card" id="hero">
    <div class="ico"><svg width="120" height="120"><use href="#gGlobe" width="120" height="120"/></svg></div>
    <div class="small">BOLSA</div>
    <div class="name">EXTRANJERA</div>
    <svg class="abs" id="spark" width="752" height="90" viewBox="0 0 752 90">
      <rect width="752" height="90" rx="24" fill="rgba(0,0,0,.18)"/>
      <polyline id="sparkLine" points="30,72 140,58 230,64 330,42 420,48 520,26 610,32 720,12" fill="none" stroke="#c6fd34" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle id="sparkDot" cx="720" cy="12" r="15" fill="#fdfdfc" stroke="#c6fd34" stroke-width="7"/>
    </svg>
  </div>
  <div class="abs" id="crecChip">▲ CRECIMIENTO</div>

  <!-- Duelo -->
  <div class="abs" id="coins" style="left:0;top:0"></div>
  <div class="abs card duel" id="cE">
    <div class="ico"><svg width="84" height="84"><use href="#gGlobe" width="84" height="84"/></svg></div>
    <div class="small">BOLSA</div>
    <div class="name">EXTRANJERA</div>
    <div class="meter"><div class="lbl" id="lE"></div><div class="segs" id="sE"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="abs card duel" id="cL">
    <div class="ico"><svg width="84" height="84"><use href="#gHome" width="84" height="84"/></svg></div>
    <div class="small">BOLSA</div>
    <div class="name">LOCAL</div>
    <div class="meter"><div class="lbl" id="lL"></div><div class="segs" id="sL"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="abs" id="vs">VS</div>
  <div class="abs win" id="winE" style="left:290px">▲ GANA</div>
  <div class="abs win" id="winL" style="left:840px">▲ GANA</div>
</div>
<div id="controls"><input id="scrub" type="range" min="0" max="7.2" step="0.0333" value="0" style="width:100%"><span id="tc"></span></div>

<script>
// Tiempos en segundos desde el inicio del clip (00:00:39:16). Las frases calzan con los cortes del clip.
const T = {
  ext: 0.05,       // "La bolsa extranjera"              → 00:00:39:18
  crec: 1.45,      // "a nivel de crecimiento"           → 00:00:40:29
  split: 2.37,     // corte · "da más que la bolsa local" → 00:00:41:27
  local1: 2.95,    // "…la bolsa local"                  → 00:00:42:15
  pero: 3.60,      // "pero la bolsa local"              → 00:00:43:04
  div: 4.43,       // corte · "paga más dividendos"      → 00:00:43:29
  divWord: 5.10,   // "…dividendos"                      → 00:00:44:19
  que: 6.17,       // corte · "que bolsa extranjera"     → 00:00:45:21
};
const DURATION = 7.2333;
window.__DURATION = DURATION;

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p, s = 1.8) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const lerp = (a, b, p) => a + (b - a) * p;
const set = (el, tf, op = 1) => { el.style.transform = tf; el.style.opacity = op; };

const ICON_UP = '<svg width="34" height="34" viewBox="0 0 24 24"><path d="M3 17 L9 11 L13 14 L21 6" fill="none" stroke="#c6fd34" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6 H21 V12" fill="none" stroke="#c6fd34" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_COIN = '<svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c6fd34"/><text x="12" y="17" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="14" fill="#1a6f66">$</text></svg>';

// monedas de dividendos (llueven detrás de la tarjeta LOCAL)
const COINS = [[610, 0.00], [720, 0.12], [830, 0.05], [940, 0.18], [680, 0.30], [890, 0.36]];
COINS.forEach(([x], k) => {
  const d = document.createElement('div'); d.className = 'coin'; d.textContent = '$'; d.style.left = x + 'px'; d.id = 'coin' + k; $('coins').appendChild(d);
});

// medidor de 5 segmentos: n encendidos, cada uno aparece escalonado desde "from"
function meter(id, n, t, from) {
  [...$(id).children].forEach((s, k) => {
    const p = back(prog(t, from + k * 0.07, from + k * 0.07 + 0.22), 2.4);
    const on = k < n && t >= from + k * 0.07;
    s.className = on ? 'on' : '';
    s.style.transform = on ? `scaleY(${p})` : 'none';
  });
}

function render(t) {
  const bob = (ph, amp = 6) => Math.sin(t * 2.2 + ph) * amp;
  const A = t < T.split, B = !A;
  document.querySelectorAll('.mer').forEach((m) => m.setAttribute('rx', Math.abs(17 * Math.cos(t * 2.4))));

  // ---- Inicio: tarjeta grande EXTRANJERA + línea de crecimiento
  const hp = back(prog(t, T.ext, T.ext + 0.42), 1.6);
  const out = easeInOut(prog(t, T.split - 0.18, T.split + 0.1));
  set($('hero'), `translate(${-out * 240}px, ${bob(0) - out * 40}px) rotate(${lerp(-6, -1.5, hp)}deg) scale(${lerp(0.5, 1, hp) * (1 - out * 0.4)})`, A ? clamp(hp * 2) * (1 - out) : 0);
  const sp = easeOut(prog(t, T.crec, T.crec + 0.75));
  $('sparkLine').style.strokeDasharray = 760; $('sparkLine').style.strokeDashoffset = 760 * (1 - sp);
  const sd = back(prog(t, T.crec + 0.7, T.crec + 0.9), 2.6);
  $('sparkDot').setAttribute('r', Math.max(0, 15 * sd));
  const cc = back(prog(t, T.crec + 0.3, T.crec + 0.6), 2.6);
  set($('crecChip'), `translate(0, ${bob(1.2, 5) - out * 40}px) rotate(${lerp(20, 6, cc)}deg) scale(${cc})`, A ? clamp(cc * 2) * (1 - out) : 0);

  // ---- Duelo
  const ce = back(prog(t, T.split - 0.05, T.split + 0.32), 1.6);
  const cl = back(prog(t, T.local1 - 0.1, T.local1 + 0.3), 1.8);
  const focusL = prog(t, T.pero, T.pero + 0.25) * (1 - prog(t, T.que, T.que + 0.2));
  const focusE = prog(t, T.que, T.que + 0.2);
  const pulse = (at) => t >= at ? 0.10 * Math.exp(-(t - at) * 5) : 0;
  set($('cE'), `translate(${(1 - ce) * -120}px, ${bob(0)}px) rotate(-2deg) scale(${ce * (1 - 0.08 * focusL + pulse(T.que))})`, B ? clamp(ce * 2) * (1 - 0.5 * focusL) : 0);
  set($('cL'), `translate(${(1 - cl) * 160}px, ${bob(1.4)}px) rotate(2deg) scale(${cl * (1 + 0.04 * focusL + pulse(T.pero)) * (1 - 0.08 * focusE)})`, B && t >= T.local1 - 0.1 ? clamp(cl * 2) * (1 - 0.5 * focusE) : 0);
  $('cE').style.borderColor = focusE > 0.5 ? '#c6fd34' : 'transparent';
  $('cL').style.borderColor = focusL > 0.5 ? '#c6fd34' : 'transparent';
  const vp = back(prog(t, T.local1 + 0.1, T.local1 + 0.4), 2.8);
  set($('vs'), `rotate(${lerp(-90, -8, vp) + Math.sin(t * 3) * 3}deg) scale(${vp})`, B && t >= T.local1 + 0.1 ? clamp(vp * 2) : 0);

  // medidores: CRECIMIENTO (gana extranjera) → DIVIDENDOS (gana local)
  const isDiv = t >= T.div;
  const lbl = isDiv ? `${ICON_COIN}DIVIDENDOS` : `${ICON_UP}CRECIMIENTO`;
  if ($('lE').innerHTML !== lbl) { $('lE').innerHTML = lbl; $('lL').innerHTML = lbl; }
  if (!isDiv) { meter('sE', 5, t, T.split + 0.25); meter('sL', 2, t, T.local1 + 0.2); }
  else { meter('sE', 2, t, T.div + 0.15); meter('sL', 5, t, T.divWord - 0.05); }
  const wE = back(prog(t, T.split + 0.75, T.split + 1.05), 2.6);
  const wL = back(prog(t, T.divWord + 0.4, T.divWord + 0.7), 2.6);
  set($('winE'), `translate(0, ${bob(2, 4)}px) rotate(${lerp(-25, -6, wE)}deg) scale(${wE})`, B && !isDiv ? clamp(wE * 2) : 0);
  set($('winL'), `translate(0, ${bob(2.5, 4)}px) rotate(${lerp(25, 6, wL)}deg) scale(${wL})`, B && isDiv ? clamp(wL * 2) : 0);

  // lluvia de monedas en "dividendos"
  COINS.forEach(([x, d], k) => {
    const tt = t - (T.divWord + d);
    const on = B && isDiv && tt >= 0 && tt < 0.55;
    const y = -90 + 900 * tt * tt + 380 * tt;
    set($('coin' + k), `translate(0, ${y}px) rotate(${tt * 320 * (k % 2 ? 1 : -1)}deg)`, on ? 1 - prog(tt, 0.38, 0.55) : 0);
  });
}

window.__render = (t) => { render(t); $('tc').textContent = t.toFixed(2) + ' s'; };

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else {
  const sc = $('scrub');
  sc.oninput = () => __render(+sc.value);
  const t0 = performance.now();
  const loop = () => { if (document.activeElement !== sc) { const t = ((performance.now() - t0) / 1000) % DURATION; sc.value = t; __render(t); } requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
