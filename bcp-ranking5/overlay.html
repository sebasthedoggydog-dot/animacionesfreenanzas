<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCP Ranking 5</title>
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
    --bcp: #001c66;           /* azul del logo BCP */
  }
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url(../hook-dividendos/fonts/montserrat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(../hook-dividendos/fonts/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(../hook-dividendos/fonts/montserrat-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Free Serif'; font-style: italic; src: url(../hook-dividendos/fonts/FreeSerifItalic.ttf); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--blanco); }
  body:not(.render) { background: #2a2a2a; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }
  svg { display: block; overflow: visible; }

  /* --- Tarjeta del logo (parte 1) --- */
  #logoCard {
    left: 190px; top: 255px; width: 700px; height: 398px; border-radius: 44px; overflow: hidden;
    background: var(--bcp); border: 8px solid var(--blanco);
    box-shadow: 0 30px 60px rgba(0, 10, 50, .35);
  }
  #logoCard img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pill {
    background: var(--lima); color: var(--morado); font-weight: 800; font-size: 34px;
    letter-spacing: .06em; padding: 12px 28px 10px; border-radius: 999px; line-height: 1; white-space: nowrap;
  }
  #tickerPill { left: 150px; top: 210px; transform-origin: left center; }
  #rank {
    left: 770px; top: 170px; width: 220px; height: 220px; border-radius: 50%;
    background: var(--morado); border: 8px solid var(--lima);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: .85;
    box-shadow: 0 18px 40px rgba(30, 10, 110, .4);
  }
  #rank small { font-size: 26px; font-weight: 800; letter-spacing: .08em; color: var(--lima); }
  #rank b { font-size: 132px; font-weight: 900; color: var(--blanco); }

  /* --- Tarjeta infográfica del retorno (parte 2) --- */
  #statCard {
    left: 90px; top: 185px; width: 900px; height: 520px; border-radius: 52px;
    background: var(--verde); display: flex; flex-direction: column; align-items: center; padding-top: 52px;
    box-shadow: 0 30px 60px rgba(0, 30, 25, .35);
  }
  #statCard .pill { color: var(--verde); }
  #src { font-family: 'Free Serif', serif; font-style: italic; font-weight: 400; font-size: 34px; color: rgba(253,253,252,.85); margin-top: 14px; }
  #pct { font-size: 210px; line-height: .9; letter-spacing: -0.03em; color: var(--lima); margin-top: 10px; font-variant-numeric: tabular-nums; }
  #pct span { font-size: 150px; }
  #bar { left: 70px; top: 455px; width: 760px; height: 26px; border-radius: 13px; background: rgba(253,253,252,.18); overflow: hidden; }
  #barFill { height: 100%; width: 100%; background: var(--lima); border-radius: 13px; transform-origin: left center; }
  #miniLogo {
    left: 40px; top: 120px; width: 230px; height: 131px; border-radius: 22px; overflow: hidden;
    border: 6px solid var(--blanco); box-shadow: 0 14px 30px rgba(0,0,0,.3);
  }
  #miniLogo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #miniRank { left: 860px; top: 130px; width: 150px; height: 150px; border-radius: 50%; background: var(--morado); border: 6px solid var(--lima);
    display: flex; align-items: center; justify-content: center; font-size: 74px; }

  .spark { }
  #controls { position: fixed; left: 10px; bottom: 10px; right: 10px; font: 600 14px sans-serif; color: #fff; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <!-- Parte 1 · "La acción del BCP Credicorp uno quedó en el ranking cinco" -->
  <div class="abs" id="logoCard"><img src="assets/bcp-logo.jpg" alt="BCP"></div>
  <div class="abs pill" id="tickerPill">CREDITC1 · BANCOS</div>
  <div class="abs" id="rank"><small>RANKING</small><b>#5</b></div>
  <svg class="abs" id="spark1" width="80" height="80" style="left:100px;top:560px"><path d="M40 0 C44 30 50 36 80 40 C50 44 44 50 40 80 C36 50 30 44 0 40 C30 36 36 30 40 0Z" fill="#c6fd34"/></svg>
  <svg class="abs" id="spark2" width="54" height="54" style="left:930px;top:420px"><path d="M27 0 C30 20 34 24 54 27 C34 30 30 34 27 54 C24 34 20 30 0 27 C20 24 24 20 27 0Z" fill="#fdfdfc"/></svg>

  <!-- Parte 2 · "Con un 5,96 %" -->
  <div class="abs" id="statCard">
    <div class="pill">RETORNO POR DIVIDENDO</div>
    <div id="src">Fuente: BVL · últimos 12 meses al 01/10/2026</div>
    <div id="pct"><b id="num">0,00</b><span>%</span></div>
    <div class="abs" id="bar"><div id="barFill"></div></div>
  </div>
  <div class="abs" id="miniLogo"><img src="assets/bcp-logo.jpg" alt="BCP"></div>
  <div class="abs" id="miniRank">#5</div>
</div>
<div id="controls"><input id="scrub" type="range" min="0" max="8.933" step="0.0333" value="0" style="width:100%"><span id="tc"></span></div>

<script>
// Tiempos en segundos desde el inicio del clip (00:00:59:14 de la línea de tiempo)
const T = {
  logo: 1.10,      // "BCP"           → 00:01:00:17
  ticker: 2.25,    // "Credicorp uno" → 00:01:01:21
  rank: 4.30,      // "ranking cinco" → 00:01:03:23
  out1: 5.10,      // sale parte 1 antes del corte
  cut: 5.37,       // corte de cámara → 00:01:04:25
  count: 5.80,     // "cinco punto…"  → empieza a contar
  land: 7.35,      // "…noventa y seis" → llega a 5,96
};
const VALUE = 5.96, TOP = 10.14;     // 10,14 % = puesto 1 del ranking (Minsur), para escalar la barra
const DURATION = 8.9333;
window.__DURATION = DURATION;

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const back = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const lerp = (a, b, p) => a + (b - a) * p;
const set = (el, tf, op = 1) => { el.style.transform = tf; el.style.opacity = op; };

function render(t) {
  const bob = (ph, amp = 10) => Math.sin(t * 2.2 + ph) * amp;
  const p1 = t < T.cut, p2 = t >= T.cut;

  // ---- Parte 1
  const out = easeIn(prog(t, T.out1, T.cut));
  const lp = back(prog(t, T.logo, T.logo + 0.45), 1.5);
  set($('logoCard'), `translate(0, ${(1 - lp) * 160 + bob(0) - out * 600}px) rotate(${lerp(-10, -2, lp)}deg) scale(${lerp(0.5, 1, lp)})`,
      p1 ? clamp(lp * 2) * (1 - out) : 0);
  const tp = back(prog(t, T.ticker, T.ticker + 0.35), 2);
  set($('tickerPill'), `translate(0, ${bob(1.2, 8) - out * 600}px) rotate(-5deg) scale(${tp})`, p1 ? clamp(tp * 2) * (1 - out) : 0);
  const rp = back(prog(t, T.rank, T.rank + 0.4), 2.6);
  set($('rank'), `translate(0, ${bob(2.4, 12) - out * 600}px) rotate(${lerp(-40, 8, rp)}deg) scale(${rp})`, p1 ? clamp(rp * 2) * (1 - out) : 0);
  const sp = back(prog(t, T.logo + 0.2, T.logo + 0.6));
  set($('spark1'), `rotate(${t * 70}deg) scale(${sp * (1 - out)})`, p1 ? 1 : 0);
  set($('spark2'), `rotate(${-t * 90}deg) scale(${back(prog(t, T.logo + 0.35, T.logo + 0.75)) * (1 - out)})`, p1 ? 1 : 0);

  // ---- Parte 2
  const cp = back(prog(t, T.cut, T.cut + 0.45), 1.3);
  set($('statCard'), `translate(0, ${(1 - cp) * 220 + bob(0.5)}px) rotate(${lerp(6, -2, cp)}deg) scale(${lerp(0.6, 1, cp)})`, p2 ? clamp(cp * 2) : 0);
  const mp = back(prog(t, T.cut + 0.2, T.cut + 0.55), 2);
  set($('miniLogo'), `translate(0, ${bob(1.6, 9)}px) rotate(${lerp(-30, -7, mp)}deg) scale(${mp})`, p2 ? clamp(mp * 2) : 0);
  const mr = back(prog(t, T.cut + 0.3, T.cut + 0.65), 2.4);
  set($('miniRank'), `translate(0, ${bob(3, 11)}px) rotate(${lerp(40, 10, mr)}deg) scale(${mr})`, p2 ? clamp(mr * 2) : 0);
  // contador 0,00 → 5,96 y "golpe" al llegar
  const np = easeOut(prog(t, T.count, T.land));
  $('num').textContent = (VALUE * np).toFixed(2).replace('.', ',');
  const hit = t >= T.land ? Math.exp(-(t - T.land) * 7) : 0;
  $('pct').style.transform = `scale(${1 + 0.12 * hit})`;
  $('barFill').style.transform = `scaleX(${(VALUE / TOP) * np})`;
}

window.__render = (t) => { render(t); $('tc').textContent = t.toFixed(2) + ' s'; };

if (location.search.includes('render')) document.body.classList.add('render');
else {
  const sc = $('scrub');
  sc.oninput = () => __render(+sc.value);
  const t0 = performance.now();
  const loop = () => { if (document.activeElement !== sc) { const t = ((performance.now() - t0) / 1000) % DURATION; sc.value = t; __render(t); } requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
