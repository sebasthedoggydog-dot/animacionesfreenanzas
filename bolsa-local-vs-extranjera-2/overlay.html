<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolsa local y extranjera 2</title>
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
  }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(../hook-dividendos/fonts/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(../hook-dividendos/fonts/montserrat-latin-900-normal.woff2) format('woff2'); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--blanco); }
  body:not(.render) { background: #8a7d78; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }
  svg { display: block; overflow: visible; }

  /* Mismo sistema que "bolsa-local-vs-extranjera": tarjetas de marca con ícono + panel inferior.
     La cabeza está en y ≈ 460–525 (≈ 380 en el último plano): todo vive en y 100–470. */
  .card { left: 120px; top: 130px; width: 840px; height: 330px; border-radius: 44px; box-shadow: 0 26px 50px rgba(20, 8, 60, .38); }
  #cardL { background: var(--verde); }
  #cardE { background: var(--morado); }
  .card .ico { position: absolute; left: 44px; top: 40px; width: 140px; height: 140px; border-radius: 50%; background: var(--blanco);
    display: flex; align-items: center; justify-content: center; }
  .card .small { position: absolute; left: 214px; top: 58px; font-size: 36px; font-weight: 800; letter-spacing: .14em; color: rgba(253,253,252,.85); }
  .card .name { position: absolute; left: 210px; top: 104px; font-size: 92px; color: var(--lima); letter-spacing: -0.02em; line-height: .9; }
  .panel { position: absolute; left: 44px; top: 210px; width: 752px; height: 92px; border-radius: 24px; background: rgba(0,0,0,.18);
    display: flex; align-items: center; padding: 0 24px; gap: 18px; }
  .panel .lbl { font-size: 28px; font-weight: 800; letter-spacing: .06em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .segs { flex: 1; display: flex; gap: 10px; }
  .segs i { flex: 1; height: 44px; border-radius: 13px; background: rgba(253,253,252,.18); display: block; transform-origin: bottom center; }
  .segs i.on { background: var(--lima); }

  .chip { background: var(--lima); color: var(--morado); font-size: 32px; padding: 12px 22px 10px; border-radius: 999px;
    border: 5px solid var(--blanco); white-space: nowrap; box-shadow: 0 10px 22px rgba(20, 8, 60, .3); display: flex; align-items: center; gap: 10px; }
  #precio { left: 600px; top: 92px; }
  #anual { left: 640px; top: 420px; background: var(--morado); color: var(--lima); border-color: var(--lima); }
  #crece { left: 640px; top: 92px; }
  .coin { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: var(--lima); color: var(--verde);
    border: 5px solid var(--blanco); display: flex; align-items: center; justify-content: center; font-size: 38px; }
  #bigCoin { left: 70px; top: 80px; width: 120px; height: 120px; font-size: 70px; border-width: 7px; }

  /* plazo: 5–10 años (último plano, cabeza más alta → y 100–350) */
  #plazo { left: 70px; top: 95px; width: 940px; height: 260px; border-radius: 44px; background: var(--blanco); box-shadow: 0 26px 50px rgba(20, 8, 60, .3); }
  #plazo .tt { position: absolute; left: 150px; top: 34px; font-size: 30px; font-weight: 800; letter-spacing: .12em; color: var(--verde); }
  #plazo .big { position: absolute; left: 148px; top: 70px; font-size: 64px; color: var(--morado); letter-spacing: -0.02em; }
  #plazo .big span { color: var(--verde); }
  #hourglass { left: 36px; top: 36px; }
  #years { left: 40px; top: 168px; }

  #controls { position: fixed; left: 10px; bottom: 10px; right: 10px; font: 600 14px sans-serif; color: #fff; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="gGlobe" viewBox="-50 -50 100 100">
      <circle r="40" fill="#5723f4"/>
      <g fill="none" stroke="#c6fd34" stroke-width="5" stroke-linecap="round">
        <circle r="40"/><ellipse class="mer" rx="17" ry="40"/><line x1="0" y1="-40" x2="0" y2="40"/>
        <path d="M-37 -15 H37 M-40 0 H40 M-37 15 H37"/>
      </g>
    </symbol>
    <symbol id="gHome" viewBox="-50 -50 100 100">
      <path d="M0 44 C-8 30 -32 12 -32 -10 A32 32 0 1 1 32 -10 C32 12 8 30 0 44Z" fill="#1a6f66"/>
      <path d="M-15 -4 L0 -18 L15 -4 V12 H-15 Z" fill="#c6fd34"/><rect x="-5" y="2" width="10" height="10" fill="#1a6f66"/>
    </symbol>
  </defs>
</svg>
<div id="stage">
  <div class="abs" id="coins" style="left:0;top:0"></div>

  <!-- Parte 1: BOLSA LOCAL -->
  <div class="abs card" id="cardL">
    <div class="ico"><svg width="120" height="120"><use href="#gHome" width="120" height="120"/></svg></div>
    <div class="small">BOLSA</div>
    <div class="name">LOCAL</div>
    <div class="panel"><div class="lbl"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c6fd34"/><text x="12" y="17" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="14" fill="#1a6f66">$</text></svg>DIVIDENDOS</div>
      <div class="segs" id="sL"><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="abs chip" id="precio"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M3 12 L12 3 H21 V12 L12 21 Z" fill="#5723f4"/><circle cx="16.5" cy="7.5" r="2" fill="#c6fd34"/></svg>A BUEN PRECIO</div>
  <div class="abs coin" id="bigCoin">$</div>
  <div class="abs chip" id="anual"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M20 12 A8 8 0 1 1 17.7 6.3" fill="none" stroke="#c6fd34" stroke-width="3.2" stroke-linecap="round"/><path d="M18 2.5 V7 H13.5" fill="none" stroke="#c6fd34" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>CADA AÑO</div>

  <!-- Parte 2: BOLSA EXTRANJERA -->
  <div class="abs card" id="cardE">
    <div class="ico"><svg width="120" height="120"><use href="#gGlobe" width="120" height="120"/></svg></div>
    <div class="small">BOLSA</div>
    <div class="name">EXTRANJERA</div>
    <svg class="abs" id="spark" width="752" height="92" viewBox="0 0 752 92" style="left:44px;top:210px">
      <rect width="752" height="92" rx="24" fill="rgba(0,0,0,.18)"/>
      <polyline id="sparkLine" points="30,76 130,64 220,70 320,50 410,56 500,38 590,44 720,10" fill="none" stroke="#c6fd34" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle id="sparkDot" cx="720" cy="10" r="15" fill="#fdfdfc" stroke="#c6fd34" stroke-width="7"/>
    </svg>
  </div>
  <div class="abs chip" id="crece"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M3 17 L9 11 L13 14 L21 6" fill="none" stroke="#5723f4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 6 H21 V12" fill="none" stroke="#5723f4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>CRECE MÁS</div>

  <!-- Parte 3: plazo -->
  <div class="abs" id="plazo">
    <svg class="abs" id="hourglass" width="96" height="120" viewBox="0 0 96 120">
      <rect x="6" y="2" width="84" height="12" rx="6" fill="#5723f4"/><rect x="6" y="106" width="84" height="12" rx="6" fill="#5723f4"/>
      <path d="M16 14 H80 C80 44 54 52 54 60 C54 68 80 76 80 106 H16 C16 76 42 68 42 60 C42 52 16 44 16 14 Z" fill="none" stroke="#5723f4" stroke-width="7" stroke-linejoin="round"/>
      <path id="sandTop" d="M24 22 H72 C70 40 52 50 48 58 C44 50 26 40 24 22Z" fill="#c6fd34"/>
      <path id="sandBot" d="M22 100 H74 C72 90 58 84 48 84 C38 84 24 90 22 100Z" fill="#1a6f66"/>
    </svg>
    <div class="tt">PROMEDIO PARA ESPERAR</div>
    <div class="big" id="bigTxt"><span id="y5">5</span> – <span id="y10">10</span> AÑOS</div>
    <svg class="abs" id="years" width="860" height="70" viewBox="0 0 860 70">
      <rect x="0" y="10" width="860" height="26" rx="13" fill="rgba(87,35,244,.14)"/>
      <rect id="yearFill" x="0" y="10" width="860" height="26" rx="13" fill="#5723f4"/>
      <g id="ticks"></g>
    </svg>
  </div>
</div>
<div id="controls"><input id="scrub" type="range" min="0" max="11.7" step="0.0333" value="0" style="width:100%"><span id="tc"></span></div>

<script>
// Tiempos en segundos desde el inicio del clip (00:00:46:23). Las frases calzan con los cortes del clip.
const T = {
  local: 0.10,     // "pero la bolsa local"                → 00:00:46:26
  precio: 1.85,    // "…a un buen precio"                   → 00:00:48:18
  paga: 2.43,      // "paga"                                → 00:00:49:06
  div: 3.10,       // "buenos dividendos"                   → 00:00:49:26
  platita: 3.95,   // "o sea, platita"                      → 00:00:50:21
  anual: 4.80,     // corte · "y anual"                     → 00:00:51:17
  ext: 5.27,       // corte · "para la bolsa extranjera"    → 00:00:52:01
  crece1: 6.80,    // "si bien crece más"                   → 00:00:53:17
  crece2: 8.20,    // "y tu platita crece más"              → 00:00:54:29
  plazo: 8.87,     // corte · "es un promedio de"           → 00:00:55:19
  cinco: 10.40,    // "esperar cinco…"                      → 00:00:57:05
  diez: 10.75,     // "…diez años"                          → 00:00:57:16
};
const DURATION = 11.7;
window.__DURATION = DURATION;

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p, s = 1.8) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const lerp = (a, b, p) => a + (b - a) * p;
const set = (el, tf, op = 1) => { el.style.transform = tf; el.style.opacity = op; };

// monedas que llueven detrás de la tarjeta LOCAL en "dividendos" y "platita"
const COINS = [[180, 0.00], [330, 0.10], [480, 0.04], [640, 0.16], [790, 0.07], [900, 0.20], [260, 0.30], [720, 0.34]];
COINS.forEach(([x], k) => { const d = document.createElement('div'); d.className = 'coin'; d.textContent = '$'; d.style.left = x + 'px'; d.id = 'coin' + k; $('coins').appendChild(d); });
// marcas de años 1–10
for (let k = 1; k <= 10; k++) {
  const x = (k / 10) * 860 - 2;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.innerHTML = `<rect x="${x - 2}" y="4" width="4" height="38" rx="2" fill="${k === 5 || k === 10 ? '#c6fd34' : 'rgba(87,35,244,.35)'}"/>` +
    (k === 5 || k === 10 ? `<text x="${x}" y="66" text-anchor="${k === 10 ? 'end' : 'middle'}" font-family="Montserrat" font-weight="900" font-size="22" fill="#5723f4">${k} AÑOS</text>` : '');
  g.id = 'tick' + k; $('ticks').appendChild(g);
}

function meter(id, n, t, from) {
  [...$(id).children].forEach((s, k) => {
    const p = back(prog(t, from + k * 0.08, from + k * 0.08 + 0.22), 2.4);
    const on = k < n && t >= from + k * 0.08;
    s.className = on ? 'on' : '';
    s.style.transform = on ? `scaleY(${p})` : 'none';
  });
}

function render(t) {
  const bob = (ph, amp = 6) => Math.sin(t * 2.2 + ph) * amp;
  const P1 = t < T.ext, P2 = t >= T.ext && t < T.plazo, P3 = t >= T.plazo;
  document.querySelectorAll('.mer').forEach((m) => m.setAttribute('rx', Math.abs(17 * Math.cos(t * 2.4))));

  // ---- Parte 1: BOLSA LOCAL
  const lp = back(prog(t, T.local, T.local + 0.42), 1.6);
  const out1 = easeIn(prog(t, T.ext - 0.2, T.ext));
  set($('cardL'), `translate(${-out1 * 900}px, ${bob(0)}px) rotate(${lerp(6, 1.5, lp)}deg) scale(${lerp(0.5, 1, lp)})`, P1 ? clamp(lp * 2) : 0);
  const pr = back(prog(t, T.precio, T.precio + 0.3), 2.6);
  set($('precio'), `translate(${-out1 * 900}px, ${bob(1.2, 5)}px) rotate(${lerp(25, 6, pr)}deg) scale(${pr})`, P1 && t >= T.precio ? clamp(pr * 2) : 0);
  meter('sL', 5, t, T.div - 0.1);
  // moneda grande en "platita"
  const bc = back(prog(t, T.platita, T.platita + 0.3), 2.8);
  const bcBeat = t > T.platita + 0.3 ? 0.08 * Math.sin((t - T.platita) * 10) * Math.exp(-(t - T.platita - 0.3) * 3) : 0;
  set($('bigCoin'), `translate(${-out1 * 900}px, ${bob(2, 5)}px) rotate(${lerp(-200, -10, bc)}deg) scale(${bc + bcBeat})`, P1 && t >= T.platita ? clamp(bc * 2) : 0);
  const an = back(prog(t, T.anual, T.anual + 0.3), 2.6);
  set($('anual'), `translate(${-out1 * 900}px, ${bob(2.6, 5)}px) rotate(${lerp(-20, -5, an)}deg) scale(${an})`, P1 && t >= T.anual ? clamp(an * 2) : 0);
  COINS.forEach(([x, d], k) => {
    let op = 0, y = 0, rot = 0;
    for (const at of [T.div, T.platita]) {
      const tt = t - (at + d);
      if (tt >= 0 && tt < 0.6) { y = -90 + 900 * tt * tt + 360 * tt; rot = tt * 320 * (k % 2 ? 1 : -1); op = 1 - prog(tt, 0.4, 0.6); }
    }
    set($('coin' + k), `translate(0, ${y}px) rotate(${rot}deg)`, P1 ? op : 0);
  });

  // ---- Parte 2: BOLSA EXTRANJERA
  const ep = back(prog(t, T.ext, T.ext + 0.4), 1.5);
  const out2 = easeIn(prog(t, T.plazo - 0.2, T.plazo));
  set($('cardE'), `translate(${(1 - ep) * 900 - out2 * 900}px, ${bob(0.6)}px) rotate(${lerp(-6, -1.5, ep)}deg)`, P2 ? 1 : 0);
  // la línea sube en dos tramos: "crece más" y "tu platita crece más"
  const s1 = easeOut(prog(t, T.crece1, T.crece1 + 0.6)), s2 = easeOut(prog(t, T.crece2, T.crece2 + 0.5));
  $('sparkLine').style.strokeDasharray = 760; $('sparkLine').style.strokeDashoffset = 760 * (1 - (0.55 * s1 + 0.45 * s2));
  const sd = back(prog(t, T.crece2 + 0.45, T.crece2 + 0.65), 2.6);
  $('sparkDot').setAttribute('r', Math.max(0, 15 * sd));
  const cr = back(prog(t, T.crece1 + 0.2, T.crece1 + 0.5), 2.6);
  const crBeat = t >= T.crece2 ? 0.12 * Math.exp(-(t - T.crece2) * 5) : 0;
  set($('crece'), `translate(${-out2 * 900}px, ${bob(1.2, 5)}px) rotate(${lerp(20, 6, cr)}deg) scale(${cr + crBeat})`, P2 && t >= T.crece1 + 0.2 ? clamp(cr * 2) : 0);

  // ---- Parte 3: esperar 5–10 años
  const zp = back(prog(t, T.plazo, T.plazo + 0.4), 1.5);
  set($('plazo'), `translate(0, ${(1 - zp) * -200 + bob(0.3, 5)}px) rotate(${lerp(-5, -1, zp)}deg) scale(${lerp(0.6, 1, zp)})`, P3 ? clamp(zp * 2) : 0);
  const sand = prog(t, T.plazo + 0.3, DURATION);
  $('sandTop').style.transform = `scaleY(${1 - sand})`; $('sandTop').style.transformOrigin = '48px 58px';
  $('sandBot').style.transform = `scaleY(${0.3 + sand * 0.7})`; $('sandBot').style.transformOrigin = '48px 100px';
  $('hourglass').style.transform = `rotate(${t >= T.plazo + 0.2 && t < T.plazo + 0.7 ? 180 * easeInOut(prog(t, T.plazo + 0.2, T.plazo + 0.7)) - 180 : 0}deg)`;
  const f5 = easeOut(prog(t, T.cinco - 0.1, T.cinco + 0.25)), f10 = easeOut(prog(t, T.diez - 0.05, T.diez + 0.35));
  $('yearFill').setAttribute('width', 860 * (0.5 * f5 + 0.5 * f10));
  const p5 = back(prog(t, T.cinco, T.cinco + 0.25), 2.6), p10 = back(prog(t, T.diez, T.diez + 0.25), 2.6);
  $('y5').style.display = 'inline-block'; $('y10').style.display = 'inline-block';
  $('y5').style.transform = `scale(${t >= T.cinco ? 1 + 0.25 * (p5 > 1 ? p5 - 1 : 0) * 4 : 1})`;
  $('y10').style.transform = `scale(${t >= T.diez ? 1 + 0.25 * (p10 > 1 ? p10 - 1 : 0) * 4 : 1})`;
  $('y5').style.color = t >= T.cinco ? '#1a6f66' : 'rgba(26,111,102,.35)';
  $('y10').style.color = t >= T.diez ? '#1a6f66' : 'rgba(26,111,102,.35)';
}

window.__render = (t) => { render(t); $('tc').textContent = t.toFixed(2) + ' s'; };

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else {
  const sc = $('scrub');
  sc.oninput = () => __render(+sc.value);
  const t0 = performance.now();
  const loop = () => { if (document.activeElement !== sc) { const t = ((performance.now() - t0) / 1000) % DURATION; sc.value = t; __render(t); } requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
