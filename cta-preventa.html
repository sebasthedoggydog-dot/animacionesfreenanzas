<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separa tu cupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* Imagen fija (Historia 9:16) para el CTA de las preventas.
     El espacio bajo la flecha queda libre para el sticker de link de Instagram. */
  :root { --morado: #5723f4; --verde: #1a6f66; --lima: #c6fd34; --blanco: #fdfdfc; --tinta: #14112a;
          --serif: 'Instrument Serif', Georgia, serif; --sans: 'Plus Jakarta Sans', sans-serif; --mono: 'DM Mono', monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; }
  body { font-family: var(--sans); color: var(--blanco); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--morado); margin: 0 auto; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(253,253,252,.10) 3px, transparent 3.5px); background-size: 54px 54px; }
  .spark { position: absolute; }
  /* Márgenes de seguridad: todo el contenido dentro de x 120–960 px y por encima del logo */
  .col { position: absolute; left: 120px; right: 120px; top: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { font-weight: 800; font-size: 84px; line-height: 1; letter-spacing: -0.02em; }
  h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 156px; line-height: .95; color: var(--lima); margin-top: 4px; }
  .uline { width: 440px; height: 10px; border-radius: 5px; background: var(--lima); margin-top: 6px; }
  .courses { display: flex; flex-direction: column; gap: 18px; margin-top: 60px; width: 100%; }
  .course { display: flex; align-items: center; gap: 20px; background: var(--blanco); color: var(--tinta); border-radius: 28px; padding: 22px 28px; text-align: left; }
  .lvl { flex: none; font-family: var(--mono); font-size: 21px; letter-spacing: .2em; color: var(--morado); background: #f1edfe; border-radius: 40px; padding: 10px 18px; text-transform: uppercase; }
  .name { font-family: var(--serif); font-size: 42px; line-height: 1; white-space: nowrap; }
  .name i { color: var(--morado); }
  #logo { position: absolute; left: 50%; top: 1625px; width: 400px; margin-left: -200px; }
</style>
</head>
<body>
<div id="stage">
  <div class="grid"></div>
  <svg class="spark" style="left:150px;top:300px" width="54" height="54" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#c6fd34"/></svg>
  <svg class="spark" style="left:880px;top:330px" width="38" height="38" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#fdfdfc"/></svg>
  <svg class="spark" style="left:880px;top:1440px" width="50" height="50" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#c6fd34"/></svg>
  <svg class="spark" style="left:150px;top:1480px" width="34" height="34" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#fdfdfc"/></svg>

  <div class="col">
    <h1>Separa tu cupo</h1>
    <h2>en preventa</h2>
    <div class="uline"></div>

    <div class="courses">
      <div class="course"><span class="lvl">Nivel 3</span><span class="name">Tu primer <i>depa de inversión.</i></span></div>
      <div class="course"><span class="lvl">Nivel 4</span><span class="name">Declara tus inversiones <i>sin miedo.</i></span></div>
    </div>

    <!-- Debajo queda espacio libre para el sticker de link -->
  </div>

  <img id="logo" src="assets/logo-freenanzas-blanco.png" alt="Freenanzas">
</div>
<script>
  // Compatible con render.mjs --stills
  window.__render = () => {};
  window.__DURATION = 0;
  window.__STILLS = { 'separa-tu-cupo': 0 };
</script>
</body>
</html>
