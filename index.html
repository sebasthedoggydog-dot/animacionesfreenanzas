<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo Freenanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=block" rel="stylesheet">
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
    --W: 1080px;
    --H: 1920px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; overflow: hidden; }
  body { font-family: 'Poppins', 'Inter', sans-serif; font-weight: 800; color: var(--blanco); }

  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative; width: var(--W); height: var(--H); overflow: hidden;
    background: var(--morado); flex: none; transform-origin: center center;
  }
  body.render #wrap { position: static; display: block; }
  body.render #stage { transform: none !important; }
  body.render #controls { display: none; }

  .scene { position: absolute; inset: 0; overflow: hidden; display: none; will-change: clip-path; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .el { display: block; will-change: transform, opacity; }
  .mask { overflow: hidden; display: block; padding: 0 12px; }
  .lima { color: var(--lima); }
  .morado { color: var(--morado); }
  .tight { line-height: .98; letter-spacing: -0.02em; }
  svg { display: block; overflow: visible; }

  /* ---------- Escena 1 ---------- */
  #s1 { background: var(--morado); }
  #s1 .rings { position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; margin: -850px 0 0 -850px; }
  #s1-sorteo { font-size: 178px; }
  #s1-freen { font-size: 118px; margin-top: -6px; }
  #s1-bar { width: 560px; height: 18px; border-radius: 9px; background: var(--lima); margin-top: 34px; transform-origin: left center; }
  #s1-gift { margin-bottom: 40px; }
  .confetti { position: absolute; left: 540px; top: 760px; border-radius: 6px; }

  /* ---------- Escena 2 ---------- */
  #s2 { background: var(--verde); }
  #s2 .col { position: absolute; left: 96px; right: 96px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  #s2 .ln { font-size: 104px; }
  #s2 .big { font-size: 176px; }
  #s2 .q { position: absolute; right: -120px; top: 330px; font-size: 1100px; color: rgba(253,253,252,.06); font-weight: 900; line-height: 1; }
  #s2-empezar { display: inline-block; position: relative; }
  #s2-hl { position: absolute; left: -22px; right: -22px; top: 10px; bottom: -20px; background: var(--lima); border-radius: 12px; transform-origin: left center; z-index: -1; }
  #s2-empezar span { position: relative; color: var(--verde); }

  /* ---------- Escena 3 ---------- */
  #s3 { background: var(--morado); }
  #s3 .glow { position: absolute; left: 50%; top: 50%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
    background: radial-gradient(circle, rgba(198,253,52,.28) 0%, rgba(198,253,52,0) 62%); }
  #s3-l1 { font-size: 100px; }
  #s3-sorpresa { font-size: 150px; margin: 6px 0; }
  #s3-l3row { display: flex; align-items: center; gap: 26px; margin-top: 10px; }
  #s3-l3 { font-size: 112px; }
  .spark { position: absolute; }

  /* ---------- Escena 4 ---------- */
  #s4 { background: var(--blanco); }
  #s4 .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(87,35,244,.10) 3px, transparent 3.5px); background-size: 54px 54px; }
  #s4 .col { position: absolute; left: 90px; right: 90px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
  #s4-head { align-self: flex-start; display: flex; flex-direction: column; gap: 18px; margin-bottom: 10px; }
  #s4-pill { align-self: flex-start; background: var(--morado); color: var(--lima); font-size: 40px; padding: 14px 34px; border-radius: 60px; letter-spacing: .06em; }
  #s4-title { color: var(--morado); font-size: 96px; }
  .card { display: flex; align-items: center; gap: 40px; height: 250px; padding: 0 44px; border-radius: 44px; box-shadow: 0 24px 50px rgba(87,35,244,.18); }
  .card .ic { flex: none; width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .card .tx { display: flex; flex-direction: column; text-align: left; }
  .card .sm { font-size: 46px; font-weight: 600; opacity: .95; }
  .card .bg { font-size: 84px; line-height: 1.02; }
  .c1 { background: var(--morado); color: var(--blanco); }
  .c2 { background: var(--verde); color: var(--blanco); }
  .c3 { background: var(--lima); color: var(--morado); }
  .c1 .ic, .c2 .ic { background: var(--lima); }
  .c3 .ic { background: var(--morado); }
  .c1 .bg, .c2 .bg { color: var(--lima); }

  /* ---------- Escena 5 ---------- */
  #s5 { background: var(--morado); }
  #s5-l1a, #s5-l1b { font-size: 104px; }
  #s5-l2 { font-size: 84px; margin-top: 54px; font-weight: 600; }
  #s5-boxwrap { position: relative; margin: 22px 0 30px; }
  #s5-ring { position: absolute; inset: -10px; border: 8px solid var(--lima); border-radius: 46px; }
  #s5-box { background: var(--lima); color: var(--morado); font-size: 150px; padding: 18px 64px 10px; border-radius: 40px; line-height: 1.1; }
  #s5-l3 { font-size: 66px; font-weight: 600; }
  #s5-cta { display: flex; align-items: center; gap: 24px; margin-top: 70px; }
  #s5-brand { position: absolute; left: 0; right: 0; top: 1480px; text-align: center; font-size: 40px; letter-spacing: .32em; color: rgba(253,253,252,.75); }

  /* ---------- Controles (solo previsualización) ---------- */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px;
    background: rgba(0,0,0,.7); font: 600 14px/1 'Poppins', sans-serif; color: #fff; z-index: 10; }
  #controls button { font: inherit; background: #c6fd34; color: #5723f4; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #controls input { flex: 1; accent-color: #c6fd34; min-width: 0; }
  #controls span { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
</style>
</head>
<body>
<div id="wrap">
<div id="stage">

  <!-- ===================== ESCENA 1 · HOOK ===================== -->
  <section class="scene" id="s1">
    <svg class="rings el" id="s1-rings" viewBox="0 0 1700 1700">
      <g fill="none" stroke="#c6fd34" stroke-width="3" opacity=".16">
        <circle cx="850" cy="850" r="300"/><circle cx="850" cy="850" r="460" stroke-dasharray="14 22"/>
        <circle cx="850" cy="850" r="640"/><circle cx="850" cy="850" r="820" stroke-dasharray="4 26"/>
      </g>
    </svg>
    <div id="s1-confetti"></div>
    <div class="center">
      <svg class="el" id="s1-gift" width="230" height="230" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="60" fill="#c6fd34"/>
        <g fill="none" stroke="#5723f4" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
          <rect x="30" y="52" width="60" height="40" rx="4"/>
          <rect x="25" y="40" width="70" height="14" rx="4"/>
          <path d="M60 40 V92"/>
          <path d="M60 40 C50 24 34 28 42 38 C46 42 54 41 60 40 C66 41 74 42 78 38 C86 28 70 24 60 40Z"/>
        </g>
      </svg>
      <span class="mask"><span class="el tight lima" id="s1-sorteo">¡SORTEO</span></span>
      <span class="mask"><span class="el tight" id="s1-freen">FREENANZAS!</span></span>
      <span class="el" id="s1-bar"></span>
    </div>
  </section>

  <!-- ===================== ESCENA 2 · DOLOR ===================== -->
  <section class="scene" id="s2">
    <div class="q el" id="s2-q">?</div>
    <div class="col">
      <span class="mask"><span class="el ln tight" id="s2-w1">¿Aún te da</span></span>
      <span class="mask"><span class="el big tight lima" id="s2-w2">miedo</span></span>
      <span class="mask"><span class="el ln tight" id="s2-w3">invertir</span></span>
      <span style="height:36px"></span>
      <span class="mask"><span class="el ln tight" id="s2-w4">y no sabes</span></span>
      <span class="mask"><span class="el ln tight" id="s2-w5">por dónde</span></span>
      <span class="mask" style="padding:14px 30px 34px;margin-left:-18px"><span class="el big tight" id="s2-w6" style="font-size:150px"><span id="s2-empezar"><i class="el" id="s2-hl"></i><span>empezar?</span></span></span></span>
    </div>
  </section>

  <!-- ===================== ESCENA 3 · SORPRESA ===================== -->
  <section class="scene" id="s3">
    <div class="glow el" id="s3-glow"></div>
    <div id="s3-sparks"></div>
    <div class="center" id="s3-content">
      <span class="mask"><span class="el tight" id="s3-l1">¡Tenemos una</span></span>
      <span class="el tight lima" id="s3-sorpresa">SORPRESA</span>
      <div id="s3-l3row">
        <span class="mask"><span class="el tight" id="s3-l3">para ti!</span></span>
        <svg class="el" id="s3-eyes" width="190" height="120" viewBox="0 0 190 120">
          <ellipse cx="50" cy="60" rx="42" ry="56" fill="#fdfdfc"/>
          <ellipse cx="140" cy="60" rx="42" ry="56" fill="#fdfdfc"/>
          <g id="s3-pupils"><circle cx="50" cy="64" r="20" fill="#1a1a2e"/><circle cx="140" cy="64" r="20" fill="#1a1a2e"/>
            <circle cx="56" cy="56" r="6" fill="#fdfdfc"/><circle cx="146" cy="56" r="6" fill="#fdfdfc"/></g>
        </svg>
      </div>
    </div>
  </section>

  <!-- ===================== ESCENA 4 · PREMIOS ===================== -->
  <section class="scene" id="s4">
    <div class="dots"></div>
    <div class="col">
      <div id="s4-head">
        <span class="el" id="s4-pill">SORTEO FREENANZAS</span>
        <span class="mask" style="padding:0"><span class="el tight" id="s4-title">Te puedes llevar:</span></span>
      </div>
      <div class="card c1 el" id="s4-c1">
        <div class="ic el" id="s4-i1"><svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="#5723f4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 36 L18 24 L26 30 L42 12"/><path d="M31 12 H42 V23"/></svg></div>
        <div class="tx"><span class="sm">Una cuenta</span><span class="bg">Trii Pro</span></div>
      </div>
      <div class="card c2 el" id="s4-c2">
        <div class="ic el" id="s4-i2"><svg width="104" height="104" viewBox="0 0 48 48" fill="none" stroke="#1a6f66" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 L24 9 L44 18 L24 27 Z"/><path d="M12 22 V32 C12 36 36 36 36 32 V22"/><path d="M44 18 V30"/></svg></div>
        <div class="tx"><span class="sm">Una beca</span><span class="bg">Bursen</span></div>
      </div>
      <div class="card c3 el" id="s4-c3">
        <div class="ic el" id="s4-i3"><svg width="100" height="100" viewBox="0 0 120 120" fill="none" stroke="#c6fd34" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"><rect x="30" y="52" width="60" height="40" rx="4"/><rect x="25" y="40" width="70" height="14" rx="4"/><path d="M60 40 V92"/><path d="M60 40 C50 24 34 28 42 38 C46 42 54 41 60 40 C66 41 74 42 78 38 C86 28 70 24 60 40Z"/></svg></div>
        <div class="tx"><span class="sm">Bono especial de</span><span class="bg">Freenanzas</span></div>
      </div>
    </div>
  </section>

  <!-- ===================== ESCENA 5 · CTA ===================== -->
  <section class="scene" id="s5">
    <div class="center">
      <span class="mask"><span class="el tight" id="s5-l1a">¿Quieres</span></span>
      <span class="mask"><span class="el tight" id="s5-l1b" style="font-size:104px">participar?</span></span>
      <span class="mask"><span class="el" id="s5-l2">Comenta</span></span>
      <div id="s5-boxwrap" class="el">
        <div id="s5-ring" class="el"></div>
        <div id="s5-box" class="el">“SORTEO”</div>
      </div>
      <span class="mask"><span class="el" id="s5-l3">y te contamos cómo</span></span>
      <div id="s5-cta" class="el">
        <svg width="110" height="110" viewBox="0 0 48 48" fill="none" stroke="#c6fd34" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 10 H40 A4 4 0 0 1 44 14 V32 A4 4 0 0 1 40 36 H20 L10 44 V36 H8 A4 4 0 0 1 4 32 V14 A4 4 0 0 1 8 10 Z"/><path d="M14 20 H34 M14 27 H27"/></svg>
        <svg class="el" id="s5-arrow" width="70" height="90" viewBox="0 0 28 36" fill="none" stroke="#c6fd34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3 V31 M4 21 L14 31 L24 21"/></svg>
      </div>
    </div>
    <div id="s5-brand" class="el">FREENANZAS</div>
  </section>

</div>
</div>

<div id="controls">
  <button id="play">Pausa</button>
  <input id="scrub" type="range" min="0" max="18" step="0.0333" value="0">
  <span id="time">0.00s</span>
</div>

<script>
/* =====================================================================
   Motor de keyframes determinista: render(t) dibuja el frame exacto en t
   (segundos). Ritmo base: 120 BPM → 1 beat = 0.5 s. Duración: 18 s.
   ===================================================================== */
const DURATION = 18;
const $ = (id) => document.getElementById(id);

// ---- Easings (equivalentes a curvas de After Effects) ----
const E = {
  lin: (p) => p,
  outCubic: (p) => 1 - Math.pow(1 - p, 3),
  inCubic: (p) => p * p * p,
  inOutCubic: (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  outExpo: (p) => (p === 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inExpo: (p) => (p === 0 ? 0 : Math.pow(2, 10 * p - 10)),
  inOutExpo: (p) => p === 0 ? 0 : p === 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  outBack: (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outBackBig: (p) => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outElastic: (p) => { const c4 = (2 * Math.PI) / 3.2; return p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -9 * p) * Math.sin((p * 10 - .75) * c4) + 1; },
};

const DEF = { x: 0, y: 0, s: 1, sx: 1, sy: 1, r: 0, o: 1, blur: 0 };

// track(id, [[tiempo, {props}, easing], ...]) — el easing de cada key rige el tramo que llega a ella.
const tracks = [];
function track(id, keys) { tracks.push({ el: $(id), keys }); }

function sample(keys, t) {
  const out = { ...DEF };
  // valores acumulados: cada key hereda lo no especificado de la anterior
  const full = []; let acc = { ...DEF };
  for (const [kt, props, ease] of keys) { acc = { ...acc, ...props }; full.push([kt, acc, ease || 'outCubic']); }
  if (t <= full[0][0]) return { ...full[0][1] };
  for (let i = 1; i < full.length; i++) {
    const [t0, a] = full[i - 1], [t1, b, ease] = full[i];
    if (t <= t1) {
      const p = E[ease]((t - t0) / (t1 - t0));
      for (const k in b) out[k] = a[k] + (b[k] - a[k]) * p;
      return out;
    }
  }
  return { ...full[full.length - 1][1] };
}

function apply(el, v) {
  el.style.transform = `translate(${v.x}px, ${v.y}px) rotate(${v.r}deg) scale(${v.s * v.sx}, ${v.s * v.sy})`;
  el.style.opacity = Math.max(0, Math.min(1, v.o));
  el.style.filter = v.blur > 0.05 ? `blur(${v.blur}px)` : 'none';
}

// Entrada estándar palabra a palabra: sube desde la máscara con pop de escala.
function wordIn(id, t, opts = {}) {
  const d = opts.d || 0.45;
  track(id, [
    [t, { y: opts.from ?? 140, o: 0, s: opts.s0 ?? 1, r: opts.r0 ?? 0 }],
    [t + d, { y: 0, o: 1, s: 1, r: 0 }, opts.ease || 'outBack'],
    ...(opts.extra || []),
  ]);
}

/* ===================== ESCENAS: ventanas de tiempo ===================== */
// [inicio de transición de entrada, fin de escena]
const SCENES = [
  { id: 's1', in: 0,    out: 2.5,  wipe: null },
  { id: 's2', in: 2.2,  out: 6.5,  wipe: { type: 'circle', t0: 2.2,  t1: 2.6,  cx: 540, cy: 960 } },
  { id: 's3', in: 6.2,  out: 9.0,  wipe: { type: 'up',     t0: 6.2,  t1: 6.6 } },
  { id: 's4', in: 8.7,  out: 14.0, wipe: { type: 'circle', t0: 8.7,  t1: 9.1,  cx: 540, cy: 900 } },
  { id: 's5', in: 13.7, out: 18.0, wipe: { type: 'left',   t0: 13.7, t1: 14.1 } },
];

/* ----------------------- ESCENA 1 · HOOK (0.0–2.5 s) ----------------------- */
track('s1-rings', [[0, { s: .4, o: 0, r: 0 }], [0.6, { s: 1, o: 1, r: 20 }, 'outExpo'], [2.5, { s: 1.08, r: 45 }, 'lin']]);
track('s1-gift', [[0, { s: 0, r: -25, o: 1 }], [0.45, { s: 1, r: 0 }, 'outBackBig'],
                  [0.75, { s: 1, r: 0 }], [0.9, { s: 1.08, r: -6 }, 'outCubic'], [1.1, { s: 1, r: 4 }, 'outCubic'], [1.3, { s: 1, r: 0 }, 'outCubic']]);
track('s1-sorteo', [[0.25, { y: 0, s: 1.9, o: 0, blur: 14 }], [0.6, { s: 1, o: 1, blur: 0 }, 'outExpo'],
                    [1.5, { s: 1 }], [1.62, { s: 1.07 }, 'outCubic'], [1.8, { s: 1 }, 'outBack']]);
wordIn('s1-freen', 0.6, { from: 150, d: 0.45 });
track('s1-bar', [[0.95, { sx: 0 }], [1.35, { sx: 1 }, 'outExpo']]);
// Salida (antes del wipe): leve zoom-in de todo el bloque
track('s1-confetti', [[0, { o: 1 }], [2.5, { o: 1 }]]);

// Confeti explosivo (radial, determinista)
const confetti = [];
(function buildConfetti() {
  const host = $('s1-confetti');
  const cols = ['#c6fd34', '#fdfdfc', '#c6fd34', '#1a6f66'];
  for (let i = 0; i < 22; i++) {
    const d = document.createElement('i');
    const w = i % 3 === 0 ? 34 : 22, h = i % 3 === 0 ? 14 : 22;
    d.className = 'confetti el';
    Object.assign(d.style, { width: w + 'px', height: h + 'px', background: cols[i % 4], borderRadius: i % 2 ? '50%' : '5px', marginLeft: -w / 2 + 'px', marginTop: -h / 2 + 'px' });
    host.appendChild(d);
    const ang = (i / 22) * Math.PI * 2 + (i % 2) * 0.13;
    const dist = 380 + ((i * 97) % 260);
    confetti.push({ el: d, ang, dist, rot: (i * 53) % 360 });
  }
})();
function renderConfetti(t) {
  const p = Math.max(0, Math.min(1, (t - 0.3) / 1.4));
  for (const c of confetti) {
    const e = E.outExpo(p);
    const x = Math.cos(c.ang) * c.dist * e;
    const y = Math.sin(c.ang) * c.dist * e + 120 * p * p; // ligera gravedad
    const o = t < 0.3 ? 0 : 1 - E.inCubic(p);
    c.el.style.transform = `translate(${x}px, ${y}px) rotate(${c.rot + p * 260}deg)`;
    c.el.style.opacity = o;
  }
}

/* ----------------------- ESCENA 2 · DOLOR (2.5–6.5 s) ----------------------- */
track('s2-q', [[2.4, { y: 60, r: 8, o: 0 }], [3.0, { y: 0, r: 0, o: 1 }, 'outCubic'], [6.5, { y: -90, r: -6 }, 'lin']]);
wordIn('s2-w1', 2.6);
// "miedo": entra con pop y un pequeño temblor (emoción)
track('s2-w2', [[3.0, { y: 160, s: .6, o: 0 }], [3.4, { y: 0, s: 1.12, o: 1 }, 'outBack'], [3.55, { s: 1 }, 'outCubic'],
                [3.6, { x: 0 }], [3.66, { x: -10 }, 'lin'], [3.72, { x: 9 }, 'lin'], [3.78, { x: -7 }, 'lin'], [3.84, { x: 5 }, 'lin'], [3.9, { x: 0 }, 'lin']]);
wordIn('s2-w3', 3.5);
wordIn('s2-w4', 4.25);
wordIn('s2-w5', 4.75);
track('s2-w6', [[5.25, { y: 170, o: 0, s: .8 }], [5.7, { y: 0, o: 1, s: 1 }, 'outBack']]);
track('s2-hl', [[5.6, { sx: 0 }], [5.95, { sx: 1 }, 'outExpo']]);

/* ----------------------- ESCENA 3 · SORPRESA (6.5–9.0 s) ----------------------- */
track('s3-glow', [[6.6, { s: .3, o: 0 }], [7.3, { s: 1, o: 1 }, 'outExpo'], [9.0, { s: 1.15 }, 'lin']]);
wordIn('s3-l1', 6.55);
// Zoom-in con rebote (elástico controlado)
track('s3-sorpresa', [[6.85, { s: 0.2, o: 0, blur: 10 }], [7.0, { o: 1, blur: 0 }, 'outCubic'], [7.55, { s: 1 }, 'outElastic']]);
wordIn('s3-l3', 7.4);
track('s3-eyes', [[7.6, { s: 0, r: -20 }], [8.0, { s: 1, r: 0 }, 'outBackBig']]);
// Salida: empuje hacia cámara (zoom-through)
track('s3-content', [[8.55, { s: 1, o: 1, blur: 0 }], [9.0, { s: 1.9, o: 0, blur: 8 }, 'inExpo']]);

const sparks = [];
(function buildSparks() {
  const host = $('s3-sparks');
  const pos = [[170, 640], [900, 560], [130, 1260], [930, 1330], [800, 420], [260, 1450]];
  pos.forEach(([x, y], i) => {
    const ns = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(ns, 'svg');
    const size = i % 2 ? 54 : 78;
    s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 40 40');
    s.setAttribute('class', 'spark el');
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.innerHTML = `<path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="${i % 3 === 2 ? '#fdfdfc' : '#c6fd34'}"/>`;
    host.appendChild(s);
    sparks.push(s);
    const t0 = 7.0 + i * 0.12;
    tracks.push({ el: s, keys: [[t0, { s: 0, r: -90 }], [t0 + .4, { s: 1, r: 0 }, 'outBackBig'], [t0 + .9, { s: .85, r: 30 }, 'inOutCubic'], [9.0, { s: 1, r: 60 }, 'lin']] });
  });
})();

/* ----------------------- ESCENA 4 · PREMIOS (9.0–14.0 s) ----------------------- */
track('s4-pill', [[9.0, { s: 0, o: 0 }], [9.35, { s: 1, o: 1 }, 'outBackBig']]);
wordIn('s4-title', 9.2, { from: 110 });
const CARD_T = [9.6, 10.1, 10.6]; // un beat entre tarjeta (120 BPM)
CARD_T.forEach((t, i) => {
  const n = i + 1;
  // Entrada escalonada de arriba hacia abajo
  track(`s4-c${n}`, [[t, { y: -120, o: 0, s: .92 }], [t + .5, { y: 0, o: 1, s: 1 }, 'outBack'],
                     [13.6 + i * 0.06, { y: 0, o: 1 }], [13.95 + i * 0.06, { y: 80, o: 0 }, 'inCubic']]);
  // Pop del icono
  track(`s4-i${n}`, [[t + .2, { s: 0, r: -30 }], [t + .55, { s: 1, r: 0 }, 'outBackBig'],
                     // "respiración" cuando aparece la última tarjeta
                     [11.6 + i * .25, { s: 1 }], [11.8 + i * .25, { s: 1.15 }, 'outCubic'], [12.05 + i * .25, { s: 1 }, 'outBack']]);
});

/* ----------------------- ESCENA 5 · CTA (14.0–18.0 s) ----------------------- */
wordIn('s5-l1a', 14.15);
wordIn('s5-l1b', 14.35);
wordIn('s5-l2', 14.85, { from: 100 });
track('s5-boxwrap', [[15.1, { s: 0, r: -12, o: 0 }], [15.25, { o: 1 }, 'lin'], [15.6, { s: 1, r: -3 }, 'outBackBig']]);
wordIn('s5-l3', 15.6, { from: 90 });
track('s5-cta', [[16.0, { y: 60, o: 0 }], [16.4, { y: 0, o: 1 }, 'outBack']]);
track('s5-brand', [[16.3, { o: 0, y: 20 }], [16.8, { o: 1, y: 0 }, 'outCubic']]);

// Pulso en verde lima sincronizado a 120 BPM (cada 2 beats = 1 s)
function renderPulse(t) {
  const box = $('s5-box'), ring = $('s5-ring'), arrow = $('s5-arrow');
  if (t < 15.6) { box.style.transform = 'scale(1)'; ring.style.opacity = 0; arrow.style.transform = 'translateY(0)'; return; }
  const ph = ((t - 15.6) % 1) / 1;               // fase 0..1 por compás
  const k = Math.pow(Math.sin(Math.PI * Math.min(1, ph / .35)), 2) * (ph < .35 ? 1 : 0);
  box.style.transform = `scale(${1 + 0.045 * k})`;
  ring.style.transform = `scale(${1 + 0.22 * E.outCubic(ph)})`;
  ring.style.opacity = (1 - E.outCubic(ph)) * 0.9;
  const b = Math.abs(Math.sin(Math.PI * ((t - 15.6) % .5) / .5));
  arrow.style.transform = `translateY(${b * 16}px)`;
}

/* ----------------------- Escena 3: pupilas que miran ----------------------- */
function renderPupils(t) {
  const p = $('s3-pupils');
  let x = 0, y = 0;
  if (t > 8.0) {
    const k = (t - 8.0);
    x = k < .25 ? -14 * E.outCubic(k / .25) : k < .5 ? -14 + 28 * E.inOutCubic((k - .25) / .25) : 14;
    y = 4;
  }
  p.setAttribute('transform', `translate(${x} ${y})`);
}

/* ----------------------- Transiciones entre escenas ----------------------- */
function renderScenes(t) {
  SCENES.forEach((sc, i) => {
    const el = $(sc.id);
    const visible = t >= sc.in && t < sc.out + (i === SCENES.length - 1 ? 1 : 0.0001);
    el.style.display = visible ? 'block' : 'none';
    el.style.zIndex = i + 1;
    if (!visible || !sc.wipe) { el.style.clipPath = 'none'; return; }
    const w = sc.wipe;
    const p = E.inOutExpo(Math.max(0, Math.min(1, (t - w.t0) / (w.t1 - w.t0))));
    if (p >= 1) { el.style.clipPath = 'none'; return; }
    if (w.type === 'circle') el.style.clipPath = `circle(${p * 1150}px at ${w.cx}px ${w.cy}px)`;
    if (w.type === 'up')     el.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0 round ${80 * (1 - p)}px)`;
    if (w.type === 'left')   el.style.clipPath = `inset(0 0 0 ${(1 - p) * 100}% round ${80 * (1 - p)}px)`;
  });
}

function render(t) {
  renderScenes(t);
  for (const tr of tracks) apply(tr.el, sample(tr.keys, t));
  renderConfetti(t);
  renderPupils(t);
  renderPulse(t);
}
window.__render = render;
window.__DURATION = DURATION;

/* ----------------------- Modo previsualización / render ----------------------- */
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) {
  document.body.classList.add('render');
  render(0);
} else {
  const stage = $('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1080, (innerHeight - 52) / 1920);
    stage.style.transform = `scale(${s}) translateY(-26px)`;
  };
  addEventListener('resize', fit); fit();
  let playing = true, t = 0, last = null;
  const scrub = $('scrub'), time = $('time'), btn = $('play');
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pausa' : 'Play'; last = null; };
  scrub.oninput = () => { t = +scrub.value; render(t); time.textContent = t.toFixed(2) + 's'; };
  const loop = (now) => {
    if (playing) {
      if (last !== null) t = (t + (now - last) / 1000) % DURATION;
      last = now;
      render(t); scrub.value = t; time.textContent = t.toFixed(2) + 's';
    }
    requestAnimationFrame(loop);
  };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
