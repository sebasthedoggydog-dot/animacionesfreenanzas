<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook migrantes</title>
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body:not(.render) { background: #2a2a2a; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  svg { display: block; overflow: visible; }
  #controls { position: fixed; left: 10px; bottom: 10px; right: 10px; font: 600 14px sans-serif; color: #fff; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <!-- Flecha de crecimiento: sube en zigzag de abajo-izquierda a arriba-derecha, pasando detrás de la persona -->
  <svg id="arrow" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g id="arrowG">
      <polyline id="shadow" points="90,1180 300,900 430,1010 640,640 760,760 930,330"
        fill="none" stroke="#5723f4" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline id="line" points="90,1180 300,900 430,1010 640,640 760,760 930,330"
        fill="none" stroke="#c6fd34" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="head" transform="translate(930 330)">
        <path d="M0 -112 L92 30 L-92 30 Z" fill="#c6fd34" stroke="#5723f4" stroke-width="14" stroke-linejoin="round"/>
      </g>
    </g>
  </svg>
</div>
<div id="controls"><input id="scrub" type="range" min="0" max="4.06" step="0.0333" value="0" style="width:100%"><span id="tc"></span></div>

<script>
// Tiempos en segundos desde 00:00:00:00
const T = {
  crecer: 3.12,    // "crecer…"   → 00:00:03:04 · la flecha empieza a subir
  platita: 3.48,   // "…platita"  → 00:00:03:14 · la punta llega y late
};
const DURATION = 4.0667;
window.__DURATION = DURATION;

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const back = (p, s = 2.4) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);

// largo de la polilínea y ángulo del último tramo (para orientar la punta)
const P = [[90,1180],[300,900],[430,1010],[640,640],[760,760],[930,330]];
let L = 0; for (let k = 1; k < P.length; k++) L += Math.hypot(P[k][0] - P[k-1][0], P[k][1] - P[k-1][1]);
const ang = Math.atan2(P[5][1] - P[4][1], P[5][0] - P[4][0]) * 180 / Math.PI + 90;

function render(t) {
  const on = t >= T.crecer;
  $('arrow').style.opacity = on ? 1 : 0;
  const d = easeOut(prog(t, T.crecer, T.platita));
  ['line', 'shadow'].forEach((id) => { $(id).style.strokeDasharray = L; $(id).style.strokeDashoffset = L * (1 - d); });
  const hp = back(prog(t, T.platita - 0.06, T.platita + 0.2));
  const beat = t > T.platita + 0.2 ? 0.08 * Math.sin((t - T.platita - 0.2) * 9) * Math.exp(-(t - T.platita - 0.2) * 2) : 0;
  $('head').setAttribute('transform', `translate(930 330) rotate(${ang}) scale(${hp + beat})`);
  // la flecha completa da un pequeño salto hacia arriba al decir "platita"
  const jump = t >= T.platita ? -24 * Math.sin(prog(t, T.platita, T.platita + 0.35) * Math.PI) : 0;
  $('arrowG').setAttribute('transform', `translate(0 ${jump})`);
}

window.__render = (t) => { render(t); $('tc').textContent = t.toFixed(2) + ' s'; };

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else {
  const sc = $('scrub');
  sc.oninput = () => __render(+sc.value);
  const t0 = performance.now();
  const loop = () => { if (document.activeElement !== sc) { const t = ((performance.now() - t0) / 1000) % DURATION; sc.value = t; __render(t); } requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
