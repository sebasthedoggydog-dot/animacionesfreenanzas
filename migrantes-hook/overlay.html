<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook migrantes</title>
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
  }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(../hook-dividendos/fonts/montserrat-latin-900-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; font-weight: 900; }
  body:not(.render) { background: #2a2a2a; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  svg { display: block; overflow: visible; }
  #controls { position: fixed; left: 10px; bottom: 10px; right: 10px; font: 600 14px sans-serif; color: #fff; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <!-- Ruta PERÚ → mundo, en arco por encima de la cabeza (la cabeza está en y ≈ 520) -->
  <svg id="route" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g id="dots"></g>
    <!-- pin PERÚ -->
    <g id="pin" transform="translate(190 450)">
      <path d="M0 0 C-14 -26 -48 -52 -48 -88 A48 48 0 1 1 48 -88 C48 -52 14 -26 0 0Z" fill="#c6fd34" stroke="#5723f4" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="0" cy="-88" r="18" fill="#5723f4"/>
      <g transform="translate(0 -170)">
        <rect x="-92" y="-34" width="184" height="62" rx="31" fill="#5723f4" stroke="#c6fd34" stroke-width="5"/>
        <text x="0" y="12" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="38" fill="#fdfdfc">PERÚ</text>
      </g>
    </g>
    <!-- globo terráqueo -->
    <g id="globe" transform="translate(840 400)">
      <g id="glow"></g>
      <circle r="92" fill="#5723f4" stroke="#c6fd34" stroke-width="10"/>
      <g fill="none" stroke="#c6fd34" stroke-width="6" stroke-linecap="round">
        <ellipse id="mer1" rx="40" ry="92"/>
        <ellipse id="mer2" rx="75" ry="92"/>
        <line x1="0" y1="-92" x2="0" y2="92"/>
        <path d="M-84 -38 H84 M-92 0 H92 M-84 38 H84"/>
      </g>
    </g>
    <!-- avioncito -->
    <g id="plane"><path d="M44 0 L-26 -12 L-40 -42 L-52 -42 L-44 -10 L-70 -8 L-80 -24 L-90 -24 L-84 0 L-90 24 L-80 24 L-70 8 L-44 10 L-52 42 L-40 42 L-26 12 Z"
      fill="#fdfdfc" stroke="#5723f4" stroke-width="7" stroke-linejoin="round" transform="scale(.85)"/></g>
  </svg>
</div>
<div id="controls"><input id="scrub" type="range" min="0" max="4.06" step="0.0333" value="0" style="width:100%"><span id="tc"></span></div>

<script>
// Tiempos en segundos desde 00:00:00:00
const T = {
  pin: 0.58,       // "…un video…"        → 00:00:00:17 · aparece el pin PERÚ
  fly: 0.85,       // "…para las personas" → el avión despega y dibuja la ruta
  globe: 1.80,     // "migrantes"          → 00:00:01:24 · llega al mundo
  out: 3.02,       // "crecer su platita"  → la ruta sale cuando entra el dinero
};
const DURATION = 4.0667;
window.__DURATION = DURATION;
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p, s = 2.2) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);

// arco (bezier cuadrática) del pin al globo
const P0 = [252, 345], C = [500, 70], P1 = [742, 382];
const bez = (u) => [
  (1 - u) * (1 - u) * P0[0] + 2 * (1 - u) * u * C[0] + u * u * P1[0],
  (1 - u) * (1 - u) * P0[1] + 2 * (1 - u) * u * C[1] + u * u * P1[1]];
const tan = (u) => Math.atan2(2 * (1 - u) * (C[1] - P0[1]) + 2 * u * (P1[1] - C[1]), 2 * (1 - u) * (C[0] - P0[0]) + 2 * u * (P1[0] - C[0])) * 180 / Math.PI;
const DOTS = 26, dots = [];
for (let k = 0; k <= DOTS; k++) {
  const c = document.createElementNS(NS, 'circle');
  const [x, y] = bez(k / DOTS);
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 9); c.setAttribute('fill', '#c6fd34');
  c.setAttribute('stroke', '#5723f4'); c.setAttribute('stroke-width', 4);
  $('dots').appendChild(c); dots.push(c);
}
// destello del globo
const rays = [];
for (let k = 0; k < 10; k++) {
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('stroke', k % 2 ? '#fdfdfc' : '#c6fd34'); l.setAttribute('stroke-width', 10); l.setAttribute('stroke-linecap', 'round');
  $('glow').appendChild(l); rays.push([l, (k / 10) * Math.PI * 2]);
}

function render(t) {
  const fade = 1 - prog(t, T.out, T.out + 0.15);
  $('route').style.opacity = fade;

  const pp = back(prog(t, T.pin, T.pin + 0.35));
  $('pin').setAttribute('transform', `translate(190 450) scale(${pp})`);

  const u = easeInOut(prog(t, T.fly, T.globe));
  dots.forEach((d, k) => d.style.opacity = k / DOTS <= u && t >= T.fly ? 1 : 0);
  const [px, py] = bez(u);
  const landed = t >= T.globe + 0.05;
  $('plane').setAttribute('transform', `translate(${px} ${py}) rotate(${tan(u)}) scale(${t >= T.fly && !landed ? 1 : 0})`);

  const gp = back(prog(t, T.globe - 0.05, T.globe + 0.3), 2.6);
  const spin = (t - T.globe) * 1.6;
  $('mer1').setAttribute('rx', Math.abs(40 * Math.cos(spin)));
  $('mer2').setAttribute('rx', Math.abs(75 * Math.cos(spin + 0.6)));
  $('globe').setAttribute('transform', `translate(840 400) scale(${t >= T.globe - 0.05 ? gp : 0})`);
  const rp = prog(t, T.globe, T.globe + 0.45);
  rays.forEach(([l, a]) => {
    const r0 = 110 + 60 * rp, r1 = r0 + 50 * (1 - rp);
    l.setAttribute('x1', Math.cos(a) * r0); l.setAttribute('y1', Math.sin(a) * r0);
    l.setAttribute('x2', Math.cos(a) * r1); l.setAttribute('y2', Math.sin(a) * r1);
  });
  $('glow').style.opacity = t >= T.globe && rp < 1 ? 1 : 0;
}

window.__render = (t) => { render(t); $('tc').textContent = t.toFixed(2) + ' s'; };

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else {
  const sc = $('scrub');
  sc.oninput = () => __render(+sc.value);
  const t0 = performance.now();
  const loop = () => { if (document.activeElement !== sc) { const t = ((performance.now() - t0) / 1000) % DURATION; sc.value = t; __render(t); } requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
