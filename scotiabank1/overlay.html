<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scotiabank top 1</title>
<style>
  /* ===== Paleta oficial Freenanzas ===== */
  :root {
    --morado: #5723f4;
    --verde: #1a6f66;
    --lima: #c6fd34;
    --blanco: #fdfdfc;
  }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(../hook-dividendos/fonts/montserrat-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 900; src: url(../hook-dividendos/fonts/montserrat-latin-900-normal.woff2) format('woff2'); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: 'Montserrat', sans-serif; font-weight: 900; color: var(--blanco); }
  body:not(.render) { background: #8a7d78; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .abs { position: absolute; will-change: transform, opacity; }
  svg { display: block; overflow: visible; }

  /* Mismo lenguaje que minsur1: estrella #1 + rayos + placa con logo. Cabeza: y ≈ 475 (toma 1) · ≈ 790 (toma 2) */
  #burst { left: -760px; top: -900px; }
  #teaser { left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
  #teaser .pill { font-size: 64px; padding: 22px 56px 18px; border-radius: 999px; background: var(--morado); color: var(--lima);
    border: 7px solid var(--lima); letter-spacing: .04em; box-shadow: 0 16px 34px rgba(20, 8, 60, .35); }
  #star { left: 280px; top: 30px; }
  #starTxt { left: 390px; top: 170px; width: 300px; height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--morado); line-height: .85; }
  #starTxt small { font-size: 34px; font-weight: 800; letter-spacing: .1em; }
  #starTxt b { font-size: 170px; }
  #mini1 { left: 60px; top: 150px; }

  #digital { left: 0; right: 0; top: 360px; display: flex; justify-content: center; }
  #digital .pill { display: flex; align-items: center; gap: 16px; font-size: 52px; padding: 18px 40px 16px; border-radius: 999px;
    background: var(--lima); color: var(--morado); border: 6px solid var(--blanco); box-shadow: 0 16px 34px rgba(20, 8, 60, .3); }
  #plaque { left: 130px; top: 500px; width: 820px; border-radius: 40px; overflow: hidden; border: 9px solid var(--blanco);
    box-shadow: 0 30px 60px rgba(20, 8, 60, .4); }
  #plaque img { width: 100%; display: block; }
  #crown { left: 830px; top: 440px; }

  #controls { position: fixed; left: 10px; bottom: 10px; right: 10px; font: 600 14px sans-serif; color: #fff; }
  body.render #controls { display: none; }
</style>
</head>
<body>
<div id="stage">
  <svg class="abs" id="burst" width="2600" height="2600" viewBox="-1300 -1300 2600 2600"><g id="burstG"></g></svg>
  <svg class="abs" id="confetti" width="1080" height="1920" style="left:0;top:0"><g id="confG"></g></svg>

  <!-- Toma 1: "Top uno" -->
  <div class="abs" id="teaser"><div class="pill">TOP…</div></div>
  <svg class="abs" id="star" width="520" height="520" viewBox="-260 -260 520 520"><path id="starPath" fill="#c6fd34" stroke="#5723f4" stroke-width="10" stroke-linejoin="round"/></svg>
  <div class="abs" id="starTxt"><small>TOP</small><b>#1</b></div>
  <svg class="abs" id="mini1" width="220" height="220" viewBox="-110 -110 220 220"><path id="miniPath" fill="#c6fd34" stroke="#5723f4" stroke-width="8" stroke-linejoin="round"/>
    <text x="0" y="24" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="72" fill="#5723f4">#1</text></svg>

  <!-- Toma 2: "Cuenta Digital Scotiabank" -->
  <div class="abs" id="digital"><div class="pill">
    <svg width="44" height="58" viewBox="0 0 22 30"><rect x="1.5" y="1.5" width="19" height="27" rx="4" fill="none" stroke="#5723f4" stroke-width="3"/><rect x="8" y="23" width="6" height="2.6" rx="1.3" fill="#5723f4"/><path d="M7 13 L10 16 L15.5 9.5" fill="none" stroke="#5723f4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    CUENTA DIGITAL</div></div>
  <div class="abs" id="plaque"><img src="assets/scotiabank-logo.png" alt="Scotiabank"></div>
  <svg class="abs" id="crown" width="170" height="116" viewBox="0 0 220 150">
    <path d="M14 46 L62 92 L110 18 L158 92 L206 46 L186 136 L34 136 Z" fill="#c6fd34" stroke="#5723f4" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="14" cy="42" r="14" fill="#fdfdfc" stroke="#5723f4" stroke-width="7"/><circle cx="110" cy="14" r="14" fill="#fdfdfc" stroke="#5723f4" stroke-width="7"/><circle cx="206" cy="42" r="14" fill="#fdfdfc" stroke="#5723f4" stroke-width="7"/>
  </svg>
</div>
<div id="controls"><input id="scrub" type="range" min="0" max="3.3" step="0.0333" value="0" style="width:100%"><span id="tc"></span></div>

<script>
// Tiempos en segundos desde el inicio del clip (00:00:11:22). Los cortes calzan con la transcripción.
const T = {
  top: 0.10,       // "Top…"                → 00:00:11:25
  uno: 0.95,       // "…uno"                → 00:00:12:21
  shot2: 1.33,     // corte · "Cuenta…"     → 00:00:13:02
  digital: 1.45,   // "Cuenta Digital"      → 00:00:13:06
  scotia: 2.10,    // "Scotiabank"          → 00:00:13:25
};
const DURATION = 3.3;
window.__DURATION = DURATION;

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p, s = 1.7) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);
const lerp = (a, b, p) => a + (b - a) * p;
const set = (el, tf, op = 1) => { el.style.transform = tf; el.style.opacity = op; };
const NS = 'http://www.w3.org/2000/svg';

function starPath(R, r, n = 16) {
  let d = '';
  for (let k = 0; k < n * 2; k++) {
    const a = (k / (n * 2)) * Math.PI * 2 - Math.PI / 2, rr = k % 2 ? r : R;
    d += (k ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1);
  }
  return d + 'Z';
}
$('starPath').setAttribute('d', starPath(240, 190));
$('miniPath').setAttribute('d', starPath(100, 78));
for (let k = 0; k < 18; k++) {
  const p = document.createElementNS(NS, 'path');
  const a0 = (k / 18) * Math.PI * 2, a1 = a0 + Math.PI / 30, R = 1300;
  p.setAttribute('d', `M0 0 L${Math.cos(a0) * R} ${Math.sin(a0) * R} L${Math.cos(a1) * R} ${Math.sin(a1) * R}Z`);
  p.setAttribute('fill', k % 2 ? 'rgba(253,253,252,.14)' : 'rgba(198,253,52,.22)');
  $('burstG').appendChild(p);
}
// confeti determinista en "uno" y en "Scotiabank"
let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COLORS = ['#c6fd34', '#5723f4', '#fdfdfc', '#1a6f66'];
const conf = Array.from({ length: 70 }, (_, i) => {
  const r = document.createElementNS(NS, 'rect');
  const w = 14 + rnd() * 16, h = 22 + rnd() * 18;
  r.setAttribute('width', w); r.setAttribute('height', h); r.setAttribute('x', -w / 2); r.setAttribute('y', -h / 2); r.setAttribute('rx', 4);
  r.setAttribute('fill', COLORS[Math.floor(rnd() * 4)]);
  $('confG').appendChild(r);
  const a = -Math.PI / 2 + (rnd() - 0.5) * 3.0, v = 500 + rnd() * 650;
  return { r, vx: Math.cos(a) * v, vy: Math.sin(a) * v, spin: (rnd() - 0.5) * 900, delay: rnd() * 0.12, at: i < 35 ? T.uno : T.scotia, oy: i < 35 ? 290 : 600 };
});

function render(t) {
  const bob = (ph, amp = 8) => Math.sin(t * 2.2 + ph) * amp;
  const s1 = t < T.shot2, s2 = !s1;

  // rayos: aparecen en "uno" y crecen en "Scotiabank"
  const bp = easeOut(prog(t, T.uno, T.uno + 0.45));
  const hit = t >= T.scotia ? 1 + 0.25 * Math.exp(-(t - T.scotia) * 3) : 1;
  const by = s2 ? 270 : 0;                 // en la toma 2 el centro de los rayos baja con la placa
  set($('burst'), `translate(0, ${by}px) rotate(${t * 18}deg) scale(${bp * hit})`, bp);

  // toma 1: "TOP…" con redoble → estrella "#1"
  const tp = back(prog(t, T.top, T.top + 0.35), 2);
  const tOut = easeIn(prog(t, T.uno - 0.12, T.uno));
  const drum = t > T.top + 0.35 && t < T.uno ? Math.sin(t * 42) * 4 * prog(t, T.top + 0.35, T.uno) : 0;
  set($('teaser'), `translate(${drum}px, ${bob(0, 5)}px) scale(${tp * (1 + tOut * 0.6)})`, clamp(tp * 2) * (1 - tOut));
  const sp = back(prog(t, T.uno, T.uno + 0.4), 2.4);
  const sOut = easeInOut(prog(t, T.shot2 - 0.05, T.shot2 + 0.25));
  const st = `translate(${-sOut * 340}px, ${-sOut * 80}px) scale(${sp * (1 - sOut)})`;
  set($('star'), st + ` rotate(${lerp(-90, 0, sp) + t * 10}deg)`, t >= T.uno ? 1 : 0);
  set($('starTxt'), st + ` rotate(${lerp(-30, -6, sp)}deg)`, t >= T.uno ? 1 : 0);
  const mp = back(prog(t, T.shot2 + 0.1, T.shot2 + 0.4), 2.4);
  set($('mini1'), `translate(0, ${bob(2, 8)}px) rotate(${-10 + Math.sin(t * 2) * 4}deg) scale(${mp})`, s2 ? 1 : 0);

  // toma 2: CUENTA DIGITAL + logo
  const dp = back(prog(t, T.digital, T.digital + 0.35), 2.2);
  set($('digital'), `translate(0, ${bob(1, 6)}px) rotate(${lerp(10, -2, dp)}deg) scale(${dp})`, s2 ? clamp(dp * 2) : 0);
  const lp = back(prog(t, T.scotia, T.scotia + 0.35), 2.0);
  const lFrom = 1.8;
  set($('plaque'), `translate(0, ${bob(0.4, 6)}px) rotate(${lerp(6, -2, lp)}deg) scale(${lerp(lFrom, 1, easeOut(prog(t, T.scotia, T.scotia + 0.2))) * (lp > 1 ? 1 + (lp - 1) * 0.5 : 1)})`,
      s2 && t >= T.scotia ? clamp(prog(t, T.scotia, T.scotia + 0.08)) : 0);
  const cr = back(prog(t, T.scotia + 0.2, T.scotia + 0.5), 2.4);
  set($('crown'), `translate(0, ${bob(1.5, 6)}px) rotate(${lerp(-40, 14, cr)}deg) scale(${cr})`, s2 && t >= T.scotia + 0.2 ? clamp(cr * 2) : 0);

  // confeti
  conf.forEach((c) => {
    const tt = t - c.at - c.delay;
    if (tt < 0 || tt > 1.1) { c.r.setAttribute('opacity', 0); return; }
    const x = 540 + c.vx * tt * 1.3, y = c.oy + c.vy * tt + 1500 * tt * tt;
    c.r.setAttribute('transform', `translate(${x} ${y}) rotate(${c.spin * tt})`);
    c.r.setAttribute('opacity', 1 - prog(tt, 0.85, 1.1));
  });
}

window.__render = (t) => { render(t); $('tc').textContent = t.toFixed(2) + ' s'; };

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else {
  const sc = $('scrub');
  sc.oninput = () => __render(+sc.value);
  const t0 = performance.now();
  const loop = () => { if (document.activeElement !== sc) { const t = ((performance.now() - t0) / 1000) % DURATION; sc.value = t; __render(t); } requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
