<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A qué precio comprar Minsur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&family=Playfair+Display:wght@900&family=Alex+Brush&display=block" rel="stylesheet">
<style>
  /* Título "A qué precio comprar Minsur" para Reel 9:16 (mismo sistema que titulo-cuentas-ahorro.html) — PNG con fondo transparente para poner encima del video.
     Jerarquía de la referencia: línea corta redondeada → palabra clave en serif condensada → script en lima. */
  :root { --lima: #c6fd34; --blanco: #fdfdfc; }
  html, body { margin: 0; background: transparent; }
  body.preview { background: linear-gradient(180deg, #6b5a44 0%, #3b3128 100%); }
  /* Render de video: fondo azul croma puro y sin sombras (una sombra sobre el azul deja un halo que el keyer no limpia) */
  body.chroma { background: #0000ff; }
  body.chroma #title { filter: none; }
  #kicker, #keyword, #script { will-change: transform, opacity, clip-path; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #title { position: absolute; top: 150px; left: 0; right: 0; text-align: center; color: var(--blanco);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)) drop-shadow(0 10px 28px rgba(0,0,0,.35)); }
  /* Nivel 1: contexto, ligero y aireado */
  #kicker { font-family: 'Quicksand', sans-serif; font-weight: 500; font-size: 58px; line-height: 1; letter-spacing: .02em; }
  #kicker b { font-weight: 700; }
  /* Nivel 2: bloque fuerte en serif condensada, una sola línea de ancho completo */
  #keyword { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 170px; line-height: .8;
    transform: scaleX(.66); letter-spacing: -.005em; margin-top: 22px; white-space: nowrap; display: flex; justify-content: center; }
  /* Nivel 3: la palabra emocional en script lima, grande, recta y centrada bajo el serif */
  #script { font-family: 'Alex Brush', cursive; color: var(--lima); font-size: 310px; line-height: .8;
    margin-top: -6px; }
</style>
</head>
<body>
<div id="stage">
  <div id="title">
    <div id="kicker">¿A qué <b>precio</b></div>
    <div id="keyword">COMPRAR</div>
    <div id="script">Minsur?</div>
  </div>
</div>
<script>
  const q = location.search;
  if (q.includes('preview')) document.body.classList.add('preview');
  if (q.includes('render') || q.includes('chroma')) document.body.classList.add('chroma');

  // Animación de entrada (render.mjs llama a __render(t) fotograma a fotograma).
  // 0.0 línea superior sube · 0.3 COMPRAR se revela de abajo arriba · 0.8 "Minsur?" se escribe de izquierda a derecha · luego se queda fijo.
  const DURATION = 5;
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const outBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const inOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;

  function render(t) {
    const k = outCubic(prog(t, 0, .55));
    $('kicker').style.opacity = k;
    $('kicker').style.transform = `translateY(${(1 - k) * 30}px)`;

    const w = outCubic(prog(t, .3, .9));
    $('keyword').style.clipPath = `inset(${(1 - w) * 100}% -10% -10% -10%)`;
    $('keyword').style.transform = `scaleX(.66) translateY(${(1 - w) * 40}px)`;

    // Escritura: barrido de borde limpio (sin degradado, para que el croma no deje halo) + leve asentamiento de escala
    const s = inOutSine(prog(t, .8, 2.0));
    $('script').style.clipPath = `inset(-20% ${(1 - s) * 100}% -20% -10%)`;
    $('script').style.transform = `scale(${1.04 - .04 * outCubic(prog(t, .8, 2.2))})`;

  }
  // Ajusta el tamaño si una línea no cabe en el ancho seguro de Reels (≈ 860px)
  document.fonts.ready.then(() => {
    const fit = (el, max, scaleX = 1) => { const r = document.createRange(); r.selectNodeContents(el);
      const w = r.getBoundingClientRect().width * scaleX; if (w > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w) + 'px'; };
    fit($('keyword'), 800); fit($('script'), 860);
  });
  window.__render = render;
  window.__DURATION = DURATION;
  window.__STILLS = { '1-inicio': .45, '2-serif': .9, '3-escritura': 1.4, '4-final': 3 };
  if (q.includes('play')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; document.fonts.ready.then(loop); }
</script>
</body>
</html>
