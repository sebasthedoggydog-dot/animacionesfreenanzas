<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kit Inversor CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,700;1,800&family=Oswald:wght@500;600&display=block" rel="stylesheet">
<style>
  /* Imagen fija (Historia 9:16) para el CTA del Kit Inversor, con el estilo de la pieza "Tu turno".
     Sin precio. El hueco bajo las tarjetas queda libre para el sticker de link. */
  :root { --morado: #5723f4; --verde: #1a6f66; --lima: #c6fd34; --blanco: #fdfdfc; --tinta: #14112a;
          --sans: 'Poppins', sans-serif; --serif: 'Playfair Display', Georgia, serif; --cond: 'Oswald', sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #111; }
  body { font-family: var(--sans); color: var(--blanco); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; margin: 0 auto; background:
      radial-gradient(120% 70% at 0% 0%, rgba(140,110,230,.55) 0%, rgba(140,110,230,0) 55%),
      radial-gradient(110% 60% at 100% 100%, rgba(130,100,215,.55) 0%, rgba(130,100,215,0) 55%),
      linear-gradient(165deg, #5a33e0 0%, #4417d6 45%, #3f13cf 60%, #5532d8 100%); }
  .lines { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(253,253,252,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(253,253,252,.07) 2px, transparent 2px);
    background-size: 96px 96px; background-position: -2px -2px; }
  .spark, .dot { position: absolute; }
  .dot { border-radius: 50%; }
  /* Márgenes: contenido dentro de x 120–960, bloque centrado verticalmente */
  .col { position: absolute; left: 120px; right: 120px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .rocket { width: 170px; height: 170px; filter: drop-shadow(0 14px 20px rgba(10,5,40,.35)); margin-bottom: 14px; }
  .label { font-family: var(--cond); font-weight: 600; font-size: 34px; letter-spacing: .04em; color: var(--lima); text-transform: uppercase; display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .label i { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--lima); display: flex; align-items: center; justify-content: center; }
  .label i::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lima); }
  h1 { font-weight: 800; font-size: 88px; line-height: 1; letter-spacing: -0.02em; }
  h2 { font-family: var(--serif); font-style: italic; font-weight: 800; font-size: 128px; line-height: 1.1; color: var(--lima); }
  .uline { width: 440px; height: 10px; border-radius: 5px; background: var(--lima); margin-top: 2px; }
  .cards { display: flex; flex-direction: column; gap: 18px; margin-top: 56px; width: 100%; }
  .card { display: flex; align-items: center; gap: 22px; background: var(--lima); color: var(--tinta); border-radius: 32px; padding: 26px 30px 26px 20px; text-align: left; }
  .card img { width: 100px; height: 100px; flex: none; }
  .card small { display: block; font-family: var(--cond); font-weight: 600; font-size: 26px; letter-spacing: .08em; color: var(--morado); text-transform: uppercase; }
  .card b { display: block; font-size: 40px; font-weight: 800; line-height: 1.15; }
  .sticker-space { height: 130px; margin-top: 40px; width: 100%; }
  #logo { position: absolute; left: 50%; top: 1625px; width: 400px; margin-left: -200px; }
</style>
</head>
<body>
<div id="stage">
  <div class="lines"></div>
  <svg class="spark" style="left:150px;top:300px" width="54" height="54" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#c6fd34"/></svg>
  <svg class="spark" style="left:880px;top:340px" width="38" height="38" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#fdfdfc"/></svg>
  <svg class="spark" style="left:880px;top:1440px" width="50" height="50" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#c6fd34"/></svg>
  <svg class="spark" style="left:150px;top:1480px" width="34" height="34" viewBox="0 0 40 40"><path d="M20 0 C22 14 26 18 40 20 C26 22 22 26 20 40 C18 26 14 22 0 20 C14 18 18 14 20 0Z" fill="#fdfdfc"/></svg>
  <i class="dot" style="left:260px;top:470px;width:16px;height:16px;background:#c6fd34"></i>
  <i class="dot" style="left:820px;top:520px;width:12px;height:12px;background:#fdfdfc"></i>
  <i class="dot" style="left:860px;top:1330px;width:14px;height:14px;background:#fdfdfc"></i>
  <i class="dot" style="left:230px;top:1380px;width:18px;height:18px;background:#c6fd34"></i>

  <div class="col">
    <img class="rocket" src="assets/iconos-3d/rocket.png" alt="">
    <span class="label"><i></i>Más popular</span>
    <h1>Llévate el</h1>
    <h2>Kit Inversor</h2>
    <div class="uline"></div>

    <div class="cards">
      <div class="card"><img src="assets/iconos-3d/chart_increasing.png" alt=""><div><small>Dos bootcamps completos</small><b>Bolsa Local + Bolsa Extranjera</b></div></div>
      <div class="card"><img src="assets/iconos-3d/studio_microphone.png" alt=""><div><small>Exclusivo · 10 primeros</small><b>Q&amp;A en vivo con el equipo</b></div></div>
    </div>

    <div class="sticker-space"></div>
  </div>

  <img id="logo" src="assets/logo-freenanzas-blanco.svg" alt="Freenanzas">
</div>
<script>
  // Compatible con render.mjs --stills
  window.__render = () => {};
  window.__DURATION = 0;
  window.__STILLS = { 'kit-inversor-cta': 0 };
</script>
</body>
</html>
